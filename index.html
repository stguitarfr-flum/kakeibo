<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6a6ce0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家庭会計">
<title>家庭会計システム</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="lock" hidden>
  <h2>家 庭 会 計</h2>
  <p style="font-size:13px;opacity:.85;margin:0">暗証番号を入力してください</p>
  <input id="lockPin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
  <div class="row"><button class="btn ghost" id="lockGo">解 錠</button></div>
  <p id="lockMsg" style="font-size:12px;color:#ffd0cb;min-height:18px;margin:0"></p>
</div>

<header class="masthead">
  <h1>家庭会計</h1>
  <div class="fy">
    <select id="fySel" aria-label="年度"></select>
    <button class="lockbtn" id="btnLock" hidden>施錠</button>
  </div>
</header>

<main class="app" id="view"></main>

<nav class="tabs" id="tabs"></nav>

<script src="app.js"></script>
</body>
</html>
